<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>山东师范大学 · 复试教室 3D 预览</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0d12; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #hud {
    position: fixed; left: 18px; top: 16px; z-index: 10; color: #ece8de;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif; user-select: none;
  }
  #hud h1 { font-size: 15px; margin: 0 0 10px; font-weight: 600; letter-spacing: .6px; }
  #views { display: flex; gap: 7px; flex-wrap: wrap; max-width: 440px; }

    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);

  #err {
    position: fixed; inset: 0; display: none; place-items: center; color: #ff9a8a;
    font: 14px/1.8 "Microsoft YaHei", sans-serif; padding: 40px; text-align: center;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

}
</script>

<div id="app"></div>
<div id="hud">
  <h1>山东师范大学 · 复试教室 3D 预览</h1>
  <div id="views"></div>
  <div class="tip">左键拖拽旋转 · 滚轮缩放 · 右键平移<br />看完告诉我哪里要改，我调完再合进 InterviewRoom</div>
</div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================ 可调参数 */
const CFG = {
  room: { w: 10.4, d: 7.6, h: 3.5 },
  board: { w: 4.9, h: 1.25, y: 1.72 },
  banner: { w: 5.6, h: 0.5, y: 2.72 },
  deskRows: [-0.5, 0.9, 2.3, 3.4],
  deskCols: [-1.75, 0, 1.75],
  chairGap: 0.42,
  examinerZ: -2.95,
  tableZ: -2.5,
  pendant: [[-3.0, -1.4], [0, -1.4], [3.0, -1.4], [0, 1.6]],
};
const HALF = { x: CFG.room.w / 2, z: CFG.room.d / 2 };

/** 每帧要跑的动画回调，人物注册进来，主循环统一驱动。 */
const tickers = [];

/* ============================================================ 渲染器 */
const app = document.getElementById('app');
const errBox = document.getElementById('err');

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  errBox.style.display = 'grid';
  errBox.textContent = 'WebGL 初始化失败：' + e.message;
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
// 室内四盏吊灯 + 一盏主光，曝光压低才不会把白墙打爆
renderer.toneMappingExposure = 0.86;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161a21);

const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 80);
camera.position.set(0, 1.3, 0.02);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.42, -2.3);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI * 0.52;
controls.minDistance = 0.4;
controls.maxDistance = 16;

/* 软环境反射：让金属、塑料有层次，不至于死黑 */
{
  const c = document.createElement('canvas');
  c.width = 64; c.height = 32;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 32);
  g.addColorStop(0, '#e3e9f0');
  g.addColorStop(0.55, '#f7f0e3');
  g.addColorStop(1, '#585148');
  x.fillStyle = g;
  x.fillRect(0, 0, 64, 32);
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  scene.environment = t;
}

/* ============================================================ 贴图工具 */
function makeTexture(w, h, draw, opt = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.RepeatWrapping;
  const [rx, ry] = opt.repeat || [1, 1];
  t.repeat.set(rx, ry);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function strokePolygon(ctx, cx, cy, r, n, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = rot + (i * Math.PI * 2) / n;
    const px = cx + Math.cos(a) * r;
    const py = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
}

const TEX = {};

/* 黑板：墨绿底 + 磨损 + 板擦痕 + 复试板书 */
TEX.board = makeTexture(2048, 520, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#2d483c');
  g.addColorStop(0.45, '#233a30');
  g.addColorStop(1, '#1d322a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  // 粉笔灰：细点，之前画成大圆看着像镜头光斑
  for (let i = 0; i < 5200; i++) {
    ctx.globalAlpha = 0.02 + Math.random() * 0.045;
    ctx.fillStyle = Math.random() > 0.5 ? '#ffffff' : '#cfe0d6';
    const s = 1 + Math.random() * 3.5;
    ctx.fillRect(Math.random() * w, Math.random() * h, s, s);
  }
  // 板擦拖痕：压扁的细长椭圆
  ctx.globalAlpha = 0.05;
  for (let i = 0; i < 26; i++) {
    ctx.fillStyle = '#b9cec3';
    ctx.save();
    ctx.translate(Math.random() * w, Math.random() * h);
    ctx.rotate((Math.random() - 0.5) * 0.5);
    ctx.scale(1, 0.12 + Math.random() * 0.1);
    ctx.beginPath();
    ctx.arc(0, 0, 60 + Math.random() * 120, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  ctx.globalAlpha = 0.07;
  ctx.fillStyle = '#a9bfb2';
  for (let i = 0; i < 8; i++) {
    ctx.fillRect(Math.random() * w * 0.8, Math.random() * h * 0.72,
      150 + Math.random() * 190, 22 + Math.random() * 26);
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = 'rgba(238,248,240,0.09)';
  ctx.lineWidth = 3;
  strokePolygon(ctx, 118, 432, 40, 22);
  strokePolygon(ctx, 1932, 128, 34, 5, -Math.PI / 2);

  const chalk = (a) => 'rgba(242,250,244,' + a + ')';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(242,250,244,0.35)';
  ctx.shadowBlur = 4;

  ctx.fillStyle = chalk(0.92);
  ctx.font = 'bold 64px "Kaiti SC","KaiTi","STKaiti","SimHei",sans-serif';
  ctx.fillText('山东师范大学', w / 2, 88);

  ctx.font = '600 46px "Kaiti SC","KaiTi","STKaiti","SimHei",sans-serif';
  ctx.fillStyle = chalk(0.84);
  ctx.fillText('2027 年硕士研究生招生复试', w / 2, 158);

  ctx.font = '42px "Kaiti SC","KaiTi","STKaiti","SimHei",sans-serif';
  ctx.fillStyle = chalk(0.8);
  ctx.fillText('人工智能（0812）· 综合面试', w / 2, 218);

  ctx.shadowBlur = 0;
  ctx.strokeStyle = chalk(0.38);
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(300, 258);
  ctx.lineTo(w - 300, 258);
  ctx.stroke();

  ctx.font = '34px "Kaiti SC","KaiTi","STKaiti","SimHei",sans-serif';
  ctx.fillStyle = chalk(0.78);
  ctx.fillText('一、中文自我介绍（1—2 分钟）', w / 2, 318);
  ctx.fillText('二、专业基础与项目追问', w / 2, 376);
  ctx.fillText('三、英语问答与综合素质', w / 2, 434);

  ctx.font = '28px "Kaiti SC","KaiTi","STKaiti","SimHei",sans-serif';
  ctx.fillStyle = chalk(0.48);
  ctx.fillText('请按顺序作答，不要背稿', w / 2, 486);
});

/* 大理石：每块砖都是从同一张板上切下来的，所以纹理止于砖缝 */
function drawMarbleTile(ctx, ox, oy, size) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(ox, oy, size, size);
  ctx.clip();

  const base = ctx.createLinearGradient(ox, oy, ox + size, oy + size);
  base.addColorStop(0, '#efedea');
  base.addColorStop(0.5, '#e3e0da');
  base.addColorStop(1, '#ebe8e2');
  ctx.fillStyle = base;
  ctx.fillRect(ox, oy, size, size);

  for (let i = 0; i < 900; i++) {
    const r = 152 + Math.floor(Math.random() * 68);
    const g = 150 + Math.floor(Math.random() * 64);
    const b = 142 + Math.floor(Math.random() * 58);
    ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',0.05)';
    const s = 2 + Math.random() * 14;
    ctx.fillRect(ox + Math.random() * size, oy + Math.random() * size, s, s);
  }

  // 主纹路：随机游走，被砖缝裁掉
  for (let v = 0; v < 4; v++) {
    let x = ox + Math.random() * size;
    let y = oy + Math.random() * size;
    let ang = Math.random() * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (let i = 0; i < 62; i++) {
      ang += (Math.random() - 0.5) * 0.55;
      x += Math.cos(ang) * (size / 56);
      y += Math.sin(ang) * (size / 56);
      ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(118,120,122,0.48)';
    ctx.lineWidth = 1.3 + Math.random() * 2.2;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  // 细纹
  for (let v = 0; v < 10; v++) {
    let x = ox + Math.random() * size;
    let y = oy + Math.random() * size;
    let ang = Math.random() * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (let i = 0; i < 34; i++) {
      ang += (Math.random() - 0.5) * 0.72;
      x += Math.cos(ang) * (size / 46);
      y += Math.sin(ang) * (size / 46);
      ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(148,150,150,0.3)';
    ctx.lineWidth = 0.7;
    ctx.stroke();
  }

  ctx.restore();
}

TEX.floor = makeTexture(1024, 1024, (ctx, w, h) => {
  const size = w / 2;
  for (let ty = 0; ty < 2; ty++) {
    for (let tx = 0; tx < 2; tx++) {
      drawMarbleTile(ctx, tx * size, ty * size, size);
    }
  }
  ctx.strokeStyle = 'rgba(170,166,158,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, size); ctx.lineTo(w, size);
  ctx.moveTo(size, 0); ctx.lineTo(size, h);
  ctx.stroke();
  ctx.strokeRect(1, 1, w - 2, h - 2);
}, { repeat: [9, 6] });

/* 复古木纹：暖棕底 + 横向年轮 + 木节 + 磨损划痕 */
TEX.wood = makeTexture(1024, 512, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#a06a37');
  g.addColorStop(0.45, '#8a5629');
  g.addColorStop(1, '#6f4420');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  for (let i = 0; i < 170; i++) {
    const y0 = (i / 170) * h + (Math.random() - 0.5) * 5;
    ctx.beginPath();
    ctx.moveTo(0, y0);
    for (let x = 0; x <= w; x += 14) {
      ctx.lineTo(x, y0 + Math.sin(x * 0.0055 + i * 0.7) * (2 + Math.random() * 3.2));
    }
    ctx.strokeStyle = Math.random() > 0.45
      ? 'rgba(58,30,12,0.20)'
      : 'rgba(206,158,104,0.13)';
    ctx.lineWidth = 0.6 + Math.random() * 1.7;
    ctx.stroke();
  }

  for (let k = 0; k < 3; k++) {
    const cx = 130 + Math.random() * (w - 260);
    const cy = 90 + Math.random() * (h - 180);
    for (let r = 5; r < 30; r += 4) {
      ctx.beginPath();
      ctx.ellipse(cx, cy, r * 1.8, r, 0.2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(66,34,14,0.15)';
      ctx.lineWidth = 1.3;
      ctx.stroke();
    }
  }

  for (let i = 0; i < 24; i++) {
    ctx.globalAlpha = 0.04 + Math.random() * 0.05;
    ctx.fillStyle = Math.random() > 0.5 ? '#dcb887' : '#4b2b13';
    ctx.beginPath();
    ctx.ellipse(Math.random() * w, Math.random() * h,
      18 + Math.random() * 70, 7 + Math.random() * 22, Math.random() * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = 'rgba(226,196,158,0.10)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 18; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + (Math.random() - 0.5) * 90, y + (Math.random() - 0.5) * 8);
    ctx.stroke();
  }
});

/* 墙面：暖白 + 抹灰质感 */
TEX.wall = makeTexture(1024, 1024, (ctx, w, h) => {
  ctx.fillStyle = '#efeae0';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) {
    const light = Math.random() > 0.5;
    ctx.fillStyle = light
      ? 'rgba(255,255,255,' + (0.02 + Math.random() * 0.03) + ')'
      : 'rgba(120,112,100,' + (0.012 + Math.random() * 0.022) + ')';
    const s = 1 + Math.random() * 3.2;
    ctx.fillRect(Math.random() * w, Math.random() * h, s, s);
  }
  for (let i = 0; i < 40; i++) {
    ctx.globalAlpha = 0.018;
    ctx.fillStyle = Math.random() > 0.5 ? '#ffffff' : '#c9c2b4';
    ctx.beginPath();
    ctx.ellipse(Math.random() * w, Math.random() * h,
      60 + Math.random() * 140, 30 + Math.random() * 70, Math.random() * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}, { repeat: [4, 2] });

/* 吊顶：矿棉板格 */
TEX.ceiling = makeTexture(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#f4f1ea';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) {
    ctx.fillStyle = 'rgba(120,114,104,' + (0.015 + Math.random() * 0.02) + ')';
    ctx.fillRect(Math.random() * w, Math.random() * h, 1.6, 1.6);
  }
  ctx.strokeStyle = 'rgba(150,144,134,0.38)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
  ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h);
  ctx.stroke();
  ctx.strokeRect(1, 1, w - 2, h - 2);
}, { repeat: [9, 6] });

/* 红底金字横幅 */
TEX.banner = makeTexture(2048, 184, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#c62a20');
  g.addColorStop(0.5, '#a81e18');
  g.addColorStop(1, '#8c1712');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 30; i++) {
    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.08)';
    ctx.fillRect((i / 30) * w, 0, (w / 30) * 0.5, h);
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd75e';
  ctx.font = 'bold 92px "Noto Sans SC","Microsoft YaHei",sans-serif';
  ctx.fillText('人工智能专业硕士研究生复试现场', w / 2, h / 2 + 4);
});

/* 电子钟 */
TEX.clock = makeTexture(256, 96, (ctx, w, h) => {
  ctx.fillStyle = '#0b0d11';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#181b21';
  ctx.fillRect(7, 7, w - 14, h - 14);
  ctx.shadowColor = 'rgba(255,58,40,0.9)';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#ff3b28';
  ctx.font = 'bold 58px "Consolas","Courier New",monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('16:16', w / 2, h / 2 + 2);
});

/* 墙上贴的守则 */
TEX.poster = makeTexture(220, 300, (ctx, w, h) => {
  ctx.fillStyle = '#eef3f7';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#3e6e9e';
  ctx.fillRect(14, 18, w - 28, 34);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 20px "Noto Sans SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('学生守则', w / 2, 42);
  ctx.fillStyle = '#8ea3b5';
  for (let i = 0; i < 11; i++) {
    ctx.fillRect(18, 74 + i * 18, (w - 36) * (0.55 + Math.random() * 0.45), 6);
  }
  ctx.fillStyle = '#dbe6ef';
  ctx.fillRect(18, 274, w - 36, 14);
});

/* 墙脚环境光遮蔽条 */
TEX.aoStrip = makeTexture(64, 128, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, h, 0, 0);
  g.addColorStop(0, 'rgba(0,0,0,0.26)');
  g.addColorStop(0.55, 'rgba(0,0,0,0.09)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
});

/* 地面整体压暗，制造房间角落的沉降感 */
TEX.aoFloor = makeTexture(512, 512, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w / 2, h / 2, w * 0.18, w / 2, h / 2, w * 0.62);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.72, 'rgba(0,0,0,0.10)');
  g.addColorStop(1, 'rgba(0,0,0,0.30)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
});

function plateTexture(name, title) {
  return makeTexture(256, 84, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(247,244,237,0.96)';
    ctx.beginPath();
    ctx.roundRect(2, 2, w - 4, h - 4, 10);
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#24322b';
    ctx.font = 'bold 38px "Noto Sans SC","Microsoft YaHei",sans-serif';
    ctx.fillText(name, w / 2, 44);
    ctx.font = '17px "Noto Sans SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = '#617066';
    ctx.fillText(title, w / 2, 68);
  });
}

/* ============================================================ 材质 */
const M = {
  // 大理石：比白墙稍深一档 + 低粗糙度，靠反光和纹理跟墙分开
  floor: new THREE.MeshStandardMaterial({
    map: TEX.floor, color: 0xe4e0da, roughness: 0.18, metalness: 0.03, envMapIntensity: 0.9,
  }),
  wall: new THREE.MeshStandardMaterial({ map: TEX.wall, roughness: 0.9, metalness: 0, side: THREE.DoubleSide }),
  ceiling: new THREE.MeshStandardMaterial({ map: TEX.ceiling, roughness: 0.92, side: THREE.DoubleSide }),
  board: new THREE.MeshStandardMaterial({ map: TEX.board, roughness: 0.94 }),
  gold: new THREE.MeshStandardMaterial({ color: 0xb28e50, roughness: 0.34, metalness: 0.62 }),
  banner: new THREE.MeshStandardMaterial({ map: TEX.banner, roughness: 0.8, side: THREE.DoubleSide }),
  clockBody: new THREE.MeshStandardMaterial({ color: 0x101318, roughness: 0.42 }),
  clockFace: new THREE.MeshBasicMaterial({ map: TEX.clock }),
  white: new THREE.MeshStandardMaterial({ color: 0xf2f0ec, roughness: 0.44, metalness: 0.05 }),
  deskTop: new THREE.MeshStandardMaterial({ map: TEX.wood, roughness: 0.4, metalness: 0.03 }),
  metal: new THREE.MeshStandardMaterial({ color: 0xc7c5c0, roughness: 0.36, metalness: 0.72 }),
  metalDark: new THREE.MeshStandardMaterial({ color: 0x6c6c6a, roughness: 0.42, metalness: 0.68 }),
  chair: new THREE.MeshStandardMaterial({ map: TEX.wood, color: 0xd6c2a8, roughness: 0.46, metalness: 0.02 }),

/**
 * 程序化人物：不依赖外部模型文件，靠几何体分层拼出来。
 *
 * 组织方式参考 three-vrm / anima3d 那类库——骨架用 Group 分层，
 * 头部单独挂在颈部枢轴上，呼吸、点头、眨眼都只改局部变换，
 * 不用每帧重建几何。每个考官靠 肤色 / 发型 / 西装色 / 领带 / 眼镜 区分开。
 */
function limb(a, b, radius, material) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const mesh = new THREE.Mesh(
    new THREE.CapsuleGeometry(radius, Math.max(0.002, len - radius * 2), 6, 12),
    material,
  );
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  mesh.castShadow = true;
  return mesh;
}

  const g = new THREE.Group();

  const ink = new THREE.MeshStandardMaterial({ color: 0x17171a, roughness: 0.45, metalness: 0.15 });
  const lipMat = new THREE.MeshStandardMaterial({ color: spec.lip, roughness: 0.5 });

  /* ---------- 躯干：收窄肩宽，头身比向真人靠 ---------- */
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.158, 0.126, 0.54, 24, 1), suit);
  body.position.y = 0.755;

  [-1, 1].forEach((s) => {

  // 白衬衫领口：只露一小条三角，之前是块"白围兜"

  vShape.moveTo(-0.034, 0.074);

  vShape.lineTo(0, -0.038);
  vShape.closePath();
  const vMesh = new THREE.Mesh(new THREE.ShapeGeometry(vShape), shirt);
  vMesh.position.set(0, 0.906, 0.111);
  g.add(vMesh);

  const collar = new THREE.Mesh(
    new THREE.CylinderGeometry(0.047, 0.051, 0.028, 16, 1, true),
    shirt,
  );
  collar.position.set(0, 0.966, 0.006);
  collar.scale.z = 0.7;
  g.add(collar);

  // 西装翻领：贴着胸口两侧框住衬衫
  [-1, 1].forEach((s) => {
    const l = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.155, 0.012), lapelMat);
    l.position.set(s * 0.058, 0.893, 0.102);
    l.rotation.z = -s * 0.2;
    l.rotation.y = -s * 0.1;
    g.add(l);
  });

  // 领带：带尖的真实版型，之前是一根棍子
  if (spec.tie) {
    const tShape = new THREE.Shape();
    tShape.moveTo(-0.018, 0.068);
    tShape.lineTo(0.018, 0.068);
    tShape.lineTo(0.013, -0.018);
    tShape.lineTo(0, -0.062);
    tShape.lineTo(-0.013, -0.018);
    tShape.closePath();
    const tail = new THREE.Mesh(new THREE.ShapeGeometry(tShape), spec.tieMat);
    tail.position.set(0, 0.898, 0.115);
    g.add(tail);

    const knot = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.026, 0.016), spec.tieMat);
    knot.position.set(0, 0.948, 0.116);
    g.add(knot);
  } else {
    const pin = new THREE.Mesh(new THREE.SphereGeometry(0.009, 10, 8), ink);
    pin.position.set(0.022, 0.9, 0.114);
    g.add(pin);
  }

  [0.78, 0.72].forEach((y) => {
    const btn = new THREE.Mesh(new THREE.SphereGeometry(0.0075, 10, 8), ink);
    btn.position.set(0, y, 0.109);
    g.add(btn);
  });

  /* ---------- 手臂：肘贴身、小臂搭桌，之前外翻像翅膀 ---------- */
  [-1, 1].forEach((s) => {
    const shoulder = new THREE.Vector3(s * 0.13, 1.0, 0.01);
    const elbow = new THREE.Vector3(s * 0.146, 0.795, 0.055);
    const wrist = new THREE.Vector3(s * 0.152, 0.748, 0.285);

    g.add(limb(shoulder, elbow, 0.042, suit));
    g.add(limb(elbow, wrist, 0.036, suit));

    // 手：平贴桌面的手掌，去掉正对镜头的"蟹钳手指"
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.042, 14, 12), skin);
    hand.position.set(s * 0.152, 0.745, 0.325);
    hand.scale.set(0.72, 0.34, 1.12);
    hand.rotation.y = -s * 0.3;
    hand.castShadow = true;
    g.add(hand);
  });

  /* ---------- 脖子 + 头 ---------- */
  g.add(limb(new THREE.Vector3(0, 0.975, 0.004), new THREE.Vector3(0, 1.085, 0.008), 0.04, skin));

  const headPivot = new THREE.Group();
  headPivot.position.set(0, 1.09, 0);
  g.add(headPivot);

  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.093, 28, 22), skin);
  skull.name = 'head:' + spec.name;
  skull.position.set(0, 0.115, 0);
  skull.scale.set(1, 1.13, 1.02);
  skull.castShadow = true;
  headPivot.add(skull);

  const jaw = new THREE.Mesh(new THREE.SphereGeometry(0.062, 20, 16), skin);
  jaw.position.set(0, 0.048, 0.024);
  jaw.scale.set(1, 0.92, 0.96);
  headPivot.add(jaw);

  [-1, 1].forEach((s) => {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.021, 12, 10), skin);
    ear.position.set(s * 0.093, 0.105, 0.004);
    ear.scale.set(0.5, 1, 0.85);
    headPivot.add(ear);
  });

  // 眼睛：白眼球 + 虹膜 + 瞳孔 + 高光
  const eyes = [];
  [-1, 1].forEach((s) => {
    const eye = new THREE.Group();
    eye.position.set(s * 0.036, 0.123, 0.077);

    const white = new THREE.Mesh(new THREE.SphereGeometry(0.0225, 16, 12), shirt);
    white.name = 'eye:' + spec.name + ':' + (s > 0 ? 'r' : 'l');
    white.scale.z = 0.62;
    eye.add(white);

    const iris = new THREE.Mesh(new THREE.SphereGeometry(0.0125, 14, 12), spec.irisMat);
    iris.position.z = 0.0145;
    iris.scale.z = 0.72;
    eye.add(iris);

    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.0062, 10, 8), ink);
    pupil.position.z = 0.0225;
    pupil.scale.z = 0.72;
    eye.add(pupil);

    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.0028, 8, 6), shirt);
    glint.position.set(-0.005, 0.007, 0.0258);
    eye.add(glint);

    headPivot.add(eye);
    eyes.push(eye);

    // 眉毛挪到眼睛正上方，之前悬在额头中间
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.009, 0.01), hairMat);
    brow.position.set(s * 0.037, 0.15, 0.081);
    brow.rotation.z = -s * 0.13;
    headPivot.add(brow);
  });

  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.0165, 14, 12), skin);
  nose.position.set(0, 0.098, 0.086);
  nose.scale.set(0.82, 1.5, 1.15);
  headPivot.add(nose);

  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.024, 16, 12), lipMat);
  mouth.position.set(0, 0.052, 0.081);
  mouth.scale.set(1, 0.3, 0.42);
  headPivot.add(mouth);

  /* ---------- 发型：拆成"头顶盖 + 后脑勺"两块，正脸留出来 ---------- */
  // 之前是一整片球冠一直盖到眼睛下面，看起来像戴了个黑面罩
  const crown = new THREE.Mesh(
    new THREE.SphereGeometry(0.099, 26, 14, 0, Math.PI * 2, 0, Math.PI * 0.34),
    hairMat,
  );
  crown.position.set(0, 0.114, -0.003);
  crown.scale.set(1.03, 1.13, 1.05);
  crown.castShadow = true;
  headPivot.add(crown);

  // 后脑勺 + 两侧：正脸方向 ±0.95 rad 不覆盖
  const backHair = new THREE.Mesh(
    new THREE.SphereGeometry(0.099, 22, 16, Math.PI / 2 + 0.95, Math.PI * 2 - 1.9, 0, Math.PI * 0.6),
    hairMat,
  );
  backHair.position.set(0, 0.114, -0.003);
  backHair.scale.set(1.03, 1.13, 1.05);
  backHair.castShadow = true;
  headPivot.add(backHair);

  if (spec.hairStyle === 'medium') {
    // 两侧垂发：框住脸但不遮脸
    [-1, 1].forEach((s) => {
      const lock = new THREE.Mesh(new THREE.CapsuleGeometry(0.026, 0.095, 4, 10), hairMat);
      lock.position.set(s * 0.086, 0.05, 0.012);
      lock.scale.z = 0.78;
      lock.castShadow = true;
      headPivot.add(lock);
    });

    // 侧分缝
    const part = new THREE.Mesh(new THREE.BoxGeometry(0.058, 0.014, 0.045), hairMat);
    part.position.set(-0.028, 0.198, 0.05);
    part.rotation.z = 0.2;
    headPivot.add(part);
  } else {
    [-1, 1].forEach((s) => {
      const sideburn = new THREE.Mesh(new THREE.BoxGeometry(0.013, 0.036, 0.034), hairMat);
      sideburn.position.set(s * 0.088, 0.1, 0.024);
      headPivot.add(sideburn);
    });
  }

  /* ---------- 眼镜 ---------- */
  if (spec.glasses) {
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.35, metalness: 0.6 });
    [-1, 1].forEach((s) => {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.027, 0.0028, 8, 24), frameMat);
      ring.position.set(s * 0.036, 0.123, 0.096);
      headPivot.add(ring);

      const temple = new THREE.Mesh(new THREE.BoxGeometry(0.003, 0.0035, 0.075), frameMat);
      temple.position.set(s * 0.078, 0.127, 0.056);
      headPivot.add(temple);
    });
    const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.0032, 0.0035), frameMat);
    bridge.position.set(0, 0.125, 0.098);
    headPivot.add(bridge);
  }

  /* ---------- 待机动画：呼吸 / 轻微点头 / 眨眼 ---------- */
  const phase = spec.phase;
  tickers.push((t) => {
    const breathe = 1 + Math.sin(t * 1.55 + phase) * 0.012;
    body.scale.set(breathe, 1, 0.72 * breathe);
    headPivot.rotation.y = Math.sin(t * 0.5 + phase) * 0.05;
    headPivot.rotation.x = Math.sin(t * 0.38 + phase * 1.7) * 0.026;
    const shut = (t + phase * 1.7) % 4.3 < 0.12;
    for (let i = 0; i < eyes.length; i++) eyes[i].scale.y = shut ? 0.1 : 1;
  });

  return g;
}

/* ============================================================ 循环 */
const t0 = performance.now();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  const t = (performance.now() - t0) / 1000;
  for (let i = 0; i < tickers.length; i++) tickers[i](t);
  controls.update();
  renderer.render(scene, camera);
});

window.__sceneReady = true;

/* 给自检脚本用：投影 + 射线检测，比看像素可靠 */
window.__debug = {
  THREE,
  scene,
  camera,
  controls,
  people: EXAMINERS.map((s) => ({ name: s.name, x: s.x, z: CFG.examinerZ })),
  setView(index) {
    const v = VIEWS[index];
    camera.position.set(v.pos[0], v.pos[1], v.pos[2]);
    controls.target.set(v.tgt[0], v.tgt[1], v.tgt[2]);
    controls.update();
  },
  viewNames: VIEWS.map((v) => v.name),
  /** 眼睛有没有被头发挡住：从相机打射线到眼白，看第一个撞到的是不是它自己 */
  inspectEyes() {
    const out = [];
    for (const p of this.people) {
      for (const side of ['l', 'r']) {
        const eye = this.scene.getObjectByName('eye:' + p.name + ':' + side);
        if (!eye) continue;
        const wp = new THREE.Vector3();
        eye.getWorldPosition(wp);
        const eyeDist = this.camera.position.distanceTo(wp);
        const dir = wp.clone().sub(this.camera.position).normalize();
        const rc = new THREE.Raycaster(this.camera.position.clone(), dir);
        const hits = rc.intersectObjects(this.scene.children, true);
        const first = hits.find((h) => h.distance > 0.04);
        out.push({
          name: p.name + ':' + side,
          eyeDist: +eyeDist.toFixed(3),
          firstHitDist: first ? +first.distance.toFixed(3) : null,
          firstHitName: first ? first.object.name || first.object.type : null,
          // 命中距离几乎等于眼睛距离 => 眼睛就在最前面，没被头发盖住
          visible: first ? first.distance > eyeDist - 0.03 : false,
        });
      }
    }
    return out;
  },
  /** 每个头在屏幕上的位置、是否在画面内、第一命中物是不是它自己 */
  inspectHeads() {    const out = [];
    for (const p of this.people) {
      const head = this.scene.getObjectByName('head:' + p.name);
      if (!head) {
        out.push({ name: p.name, error: '找不到头部网格' });
        continue;
      }
      const wp = new THREE.Vector3();
      head.getWorldPosition(wp);
      const ndc = wp.clone().project(this.camera);
      const dir = wp.clone().sub(this.camera.position).normalize();
      const rc = new THREE.Raycaster(this.camera.position.clone(), dir);
      const hits = rc.intersectObjects(this.scene.children, true);
      const first = hits.find((h) => h.distance > 0.04);
      out.push({
        name: p.name,
        world: [+wp.x.toFixed(2), +wp.y.toFixed(2), +wp.z.toFixed(2)],
        ndc: [+ndc.x.toFixed(3), +ndc.y.toFixed(3), +ndc.z.toFixed(3)],
        inFrame: Math.abs(ndc.x) < 1 && Math.abs(ndc.y) < 1 && ndc.z < 1,
        headDist: +this.camera.position.distanceTo(wp).toFixed(3),
        firstHit: first
          ? {
              obj: first.object.name || first.object.type,
              // 沿父链找归属：射线多半先撞到鼻子/眉毛，那也算这个人的脸
              owner: (() => {
                let o = first.object;
                while (o) {
                  if (o.name && o.name.indexOf('person:') === 0) return o.name;
                  o = o.parent;
                }
                return '(场景)';
              })(),
              dist: +first.distance.toFixed(3),
            }
          : null,
      });
    }
    return out;
  },
};
