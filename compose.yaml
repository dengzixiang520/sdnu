services:
  api:
    build: .
    environment:
      ZHQ_ENVIRONMENT: development
      ZHQ_SECRET_KEY: change-before-deployment
      ZHQ_WEB_ORIGIN: http://localhost:8080
      ZHQ_MEMORY_BACKEND: sqlite
      ZHQ_SQLITE_MEMORY_PATH: /app/data/zhihui_qilu_memory.sqlite3
    ports: ["8000:8000"]
    volumes: ["memory_data:/app/data"]
  web:
    build: ./web
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  memory_data:
